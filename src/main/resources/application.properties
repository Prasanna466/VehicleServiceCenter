spring.application.name=VehicleServiceCenter

spring.datasource.url=jdbc:mysql://localhost:3306/vehicleServiceCenter
spring.datasource.username=root
spring.datasource.password=Prasanna@46

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

logging.level.root=INFO
logging.level.com.example.VehicleServiceCenter=INFO
logging.file.name=logs/vehicle-service-center.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7


management.endpoints.web.exposure.include=health,info,metrics
management.info.env.enabled=true
info.app.name=Vehicle Service Center
info.app.description=Vehicle Service Center Management System
info.app.version=1.0.0

app.scheduler.pending-check-delay-ms=10000

# Scheduler logging
logging.level.com.example.VehicleServiceCenter.scheduler=INFO
logging.level.org.springframework.scheduling=DEBUG


# Connection pool name
spring.datasource.hikari.pool-name=VehicleServiceCenterPool

# Maximum number of database connections
spring.datasource.hikari.maximum-pool-size=10

# Minimum number of idle connections
spring.datasource.hikari.minimum-idle=2

# Maximum time to wait for a connection: 30 seconds
spring.datasource.hikari.connection-timeout=30000

# Maximum time an idle connection can remain in the pool: 10 minutes
spring.datasource.hikari.idle-timeout=600000

# Maximum connection lifetime: 30 minutes
spring.datasource.hikari.max-lifetime=1800000

# Connection validation timeout: 5 seconds
spring.datasource.hikari.validation-timeout=5000

